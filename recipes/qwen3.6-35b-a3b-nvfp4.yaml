recipe_version: "1"
name: Qwen36-35B-A3B-NVFP4
description: vLLM serving nvidia/Qwen3.6-35B-A3B-NVFP4 (NVFP4 quantized MoE)

# HuggingFace model to download (optional, for --download-model)
model: nvidia/Qwen3.6-35B-A3B-NVFP4

# Container image to use
container: vllm-node

# Mod required: Marlin NVFP4 backend fix for SM121 (DGX Spark)
mods:
  - mods/marlin-nvfp4

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.75
  max_model_len: 262144
  max_num_batched_tokens: 8192

# Marlin NVFP4 backend fix for SM121 (DGX Spark)
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  served_model_name: qwen3.6-35b-a3b-nvfp4
  CUTE_DSL_ARCH: sm_121a
  HF_HOME: /hf_cache

# Path to vLLM API key file (relative to spark-vllm-docker root)
# This file is read at launch time and passed as VLLM_API_KEY env var to container
api_key_file: ../.api-key

# The vLLM serve command template
# command: |
#   vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
#     --host {host} \
#     --port {port} \
#     --max-model-len {max_model_len} \
#     --max-num-batched-tokens {max_num_batched_tokens} \
#     --gpu-memory-utilization {gpu_memory_utilization} \
#     --quantization modelopt \
#     --speculative-config '{{"method":"qwen3_next_mtp","num_speculative_tokens":2}}' \
#     --trust-remote-code \
#     --moe-backend marlin \
#     --kv-cache-dtype fp8 \
#     --load-format fastsafetensors \
#     --attention-backend flashinfer \
#     --reasoning-parser qwen3 \
#     --enable-auto-tool-choice \
#     --tool-call-parser qwen3_xml \
#     --enable-prefix-caching \
#     --enable-chunked-prefill \
#     --async-scheduling \
#     -tp {tensor_parallel} \
#     --api-key DDBCQyue3aVl4Tb9

command: |
  vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4  \
   --host {host} \
   --port {port} \
   --tensor-parallel-size {tensor_parallel} \
   --trust-remote-code \
   --kv-cache-dtype fp8  \
   --attention-backend flashinfer  \
   --moe-backend marlin \
   --gpu-memory-utilization {gpu_memory_utilization}  \
   --max-model-len {max_model_len} \
   --max-num-seqs 4 \
   --max-num-batched-tokens {max_num_batched_tokens}  \
   --enable-chunked-prefill \
   --async-scheduling \
   --enable-prefix-caching \
   --speculative-config '{{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}}'  \
   --load-format fastsafetensors \
   --reasoning-parser qwen3 \
   --tool-call-parser qwen3_xml \
   --enable-auto-tool-choice